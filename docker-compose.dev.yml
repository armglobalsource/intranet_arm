# Desarrollo local — solo levanta backend y frontend
# La base de datos usa Supabase (configurada en backend/.env)
# Uso: docker compose -f docker-compose.dev.yml up
name: intranet-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intranet_backend_dev
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: intranet_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
