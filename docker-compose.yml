name: intranet

services:

  # ── Base de datos ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: intranet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-intranet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intranet_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-intranet_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intranet_user} -d ${POSTGRES_DB:-intranet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Object storage ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: intranet_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minio_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_key}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Consola web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intranet_backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    environment:
      NODE_ENV:             production
      PORT:                 3001
      DATABASE_URL:         postgresql://${POSTGRES_USER:-intranet_user}:${POSTGRES_PASSWORD:-intranet_pass}@postgres:5432/${POSTGRES_DB:-intranet_db}
      JWT_SECRET:           ${JWT_SECRET:?JWT_SECRET es requerido}
      JWT_ACCESS_TTL:       ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL:      ${JWT_REFRESH_TTL:-28800}
      MINIO_ENDPOINT:       minio
      MINIO_PORT:           9000
      MINIO_USE_SSL:        "false"
      MINIO_ACCESS_KEY:     ${MINIO_ACCESS_KEY:-minio_access_key}
      MINIO_SECRET_KEY:     ${MINIO_SECRET_KEY:-minio_secret_key}
      MINIO_BUCKET_DOCUMENTS: intranet-documents
      MINIO_BUCKET_AVATARS:   intranet-avatars
      SMTP_HOST:            ${SMTP_HOST:-}
      SMTP_PORT:            ${SMTP_PORT:-587}
      SMTP_USER:            ${SMTP_USER:-}
      SMTP_PASS:            ${SMTP_PASS:-}
      EMAIL_FROM:           ${EMAIL_FROM:-"Intranet <no-reply@empresa.com>"}
      FRONTEND_URL:         ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: intranet_frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "3000:3000"

  # ── Nginx (reverse proxy + TLS) ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: intranet_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  minio_data:
