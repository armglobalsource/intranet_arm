# cloudbuild.yaml — CI/CD automático con Cloud Build
# Se dispara en cada push a la rama main
#
# Para activarlo:
#   gcloud builds triggers create github \
#     --repo-name=intranet-arm \
#     --repo-owner=<tu-org> \
#     --branch-pattern=^main$ \
#     --build-config=cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _REGISTRY: us-central1-docker.pkg.dev/intranet-arm/intranet
  _CLOUD_SQL_INSTANCE: intranet-arm:us-central1:intranet-db

steps:
  # ── Backend: build ───────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    args:
      - build
      - --platform=linux/amd64
      - -t
      - $_REGISTRY/backend:$COMMIT_SHA
      - -t
      - $_REGISTRY/backend:latest
      - ./backend

  # ── Frontend: build ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    args:
      - build
      - --platform=linux/amd64
      - --build-arg
      - NEXT_PUBLIC_API_URL=https://ecosistema-arm.web.app/api/v1
      - -t
      - $_REGISTRY/frontend:$COMMIT_SHA
      - -t
      - $_REGISTRY/frontend:latest
      - ./frontend

  # ── Push imágenes ────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    waitFor: ['build-backend']
    args: [push, --all-tags, $_REGISTRY/backend]

  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    waitFor: ['build-frontend']
    args: [push, --all-tags, $_REGISTRY/frontend]

  # ── Deploy backend a Cloud Run ───────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-backend
    waitFor: ['push-backend']
    entrypoint: gcloud
    env: ['CLOUDSDK_CORE_DISABLE_PROMPTS=1']
    args:
      - run
      - deploy
      - intranet-backend
      - --image=$_REGISTRY/backend:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=$_CLOUD_SQL_INSTANCE
      - --set-env-vars=NODE_ENV=production,PORT=3001
      - --set-secrets=DATABASE_URL=intranet-db-url:latest,DIRECT_URL=intranet-db-url:latest,JWT_SECRET=intranet-jwt-secret:latest,GCS_PROJECT_ID=intranet-gcs-project:latest,GCS_BUCKET_DOCUMENTS=intranet-gcs-bucket-docs:latest,GCS_BUCKET_AVATARS=intranet-gcs-bucket-avatars:latest,FRONTEND_URL=intranet-frontend-url:latest,SMTP_HOST=intranet-smtp-host:latest,SMTP_PORT=intranet-smtp-port:latest,SMTP_USER=intranet-smtp-user:latest,SMTP_PASS=intranet-smtp-pass:latest,EMAIL_FROM=intranet-email-from:latest,GOOGLE_CLIENT_ID=intranet-google-client-id:latest,GOOGLE_CLIENT_SECRET=intranet-google-client-secret:latest,BACKEND_URL=intranet-backend-url:latest
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi
      - --cpu=1
      - --port=3001
      - --quiet

  # ── Deploy frontend a Cloud Run ──────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-frontend
    waitFor: ['push-frontend']
    entrypoint: gcloud
    env: ['CLOUDSDK_CORE_DISABLE_PROMPTS=1']
    args:
      - run
      - deploy
      - intranet-frontend
      - --image=$_REGISTRY/frontend:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,PORT=3000
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi
      - --cpu=1
      - --port=3000
      - --quiet

  # ── Deploy Firebase Hosting (rewrites) ───────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-hosting
    waitFor: ['deploy-backend', 'deploy-frontend']
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project $PROJECT_ID --token $$FIREBASE_TOKEN
    secretEnv: ['FIREBASE_TOKEN']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-ci-token/versions/latest
      env: FIREBASE_TOKEN

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

images:
  - $_REGISTRY/backend:$COMMIT_SHA
  - $_REGISTRY/frontend:$COMMIT_SHA
