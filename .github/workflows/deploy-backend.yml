name: Deploy Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: intranet-arm
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/intranet-arm/intranet/backend

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_BACKEND }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            FIREBASE_PROJECT_ID=intranet-arm-dev-70a30
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TTL=900
            JWT_REFRESH_TTL=28800
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            STORAGE=gcs
            GCS_PROJECT_ID=intranet-arm-dev-70a30
            GCS_BUCKET_DOCUMENTS=intranet-arm-dev-70a30.firebasestorage.app
            GCS_BUCKET_AVATARS=intranet-arm-dev-70a30.firebasestorage.app
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ secrets.CLOUD_RUN_BACKEND }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Deployed to: $URL"
          curl -sf "$URL/api/v1/health" | python3 -m json.tool
