name: Deploy Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: intranet-arm
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/intranet-arm/intranet/backend

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_BACKEND }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # env_vars omitted: Cloud Run services have their env vars configured
          # directly in GCP (Console / gcloud). Passing them here would overwrite
          # them with empty GitHub-secret values whenever a secret isn't set,
          # causing Joi validation failures (JWT_SECRET.min(32)) at startup.

      # Blindaje contra tráfico pineado a revisiones viejas:
      # si en algún momento se hizo un split manual de tráfico, los deploys
      # siguientes crean revisiones nuevas pero nunca reciben el 100% del
      # tráfico. Este paso lo fuerza explícitamente.
      - name: Force 100% traffic to latest revision
        run: |
          gcloud run services update-traffic ${{ secrets.CLOUD_RUN_BACKEND }} \
            --region=${{ env.REGION }} \
            --to-latest

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ secrets.CLOUD_RUN_BACKEND }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Deployed to: $URL"
          curl -sf "$URL/api/v1/health" | python3 -m json.tool
