name: Deploy Frontend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  PROJECT_ID: intranet-arm
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/intranet-arm/intranet/frontend

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    # Selecciona el ambiente según la rama
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          # No se pasa NEXT_PUBLIC_API_URL: el frontend usa /api/v1 (URL relativa)
          # y Firebase Hosting enruta al backend correcto en cada dominio.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_FRONTEND }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      # Blindaje contra tráfico pineado a revisiones viejas:
      # si en algún momento se hizo un split manual de tráfico, los deploys
      # siguientes crean revisiones nuevas pero nunca reciben el 100% del
      # tráfico. Este paso lo fuerza explícitamente.
      - name: Force 100% traffic to latest revision
        run: |
          gcloud run services update-traffic ${{ secrets.CLOUD_RUN_FRONTEND }} \
            --region=${{ env.REGION }} \
            --to-latest

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.PROJECT_ID }}
          target: ${{ secrets.FIREBASE_SITE }}
          channelId: live

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ secrets.CLOUD_RUN_FRONTEND }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Deployed to: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
          [[ "$STATUS" == "200" || "$STATUS" == "307" ]] && echo "✅ Frontend OK" || exit 1
